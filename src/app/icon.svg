<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald for the main L covers -->
    <linearGradient id="gradCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <!-- Teal for page 1 -->
    <linearGradient id="gradPage1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09ADAA"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    
    <!-- Neon Green for page 2 -->
    <linearGradient id="gradPage2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02FF73"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <g transform="translate(16, 16)">
    <!-- Back Vertical Cover (0deg) -->
    <rect x="80" y="80" width="70" height="320" rx="35" fill="url(#gradCover)"/>

    <!-- Page 1 (30deg) -->
    <g transform="rotate(30, 115, 365)">
      <rect x="80" y="80" width="70" height="320" rx="35" fill="url(#gradPage1)" opacity="0.9"/>
    </g>

    <!-- Page 2 (60deg) -->
    <g transform="rotate(60, 115, 365)">
      <rect x="80" y="80" width="70" height="320" rx="35" fill="url(#gradPage2)" opacity="0.9"/>
    </g>

    <!-- Front Horizontal Cover (90deg) -->
    <g transform="rotate(90, 115, 365)">
      <rect x="80" y="80" width="70" height="320" rx="35" fill="url(#gradCover)"/>
    </g>
  </g>
</svg>
